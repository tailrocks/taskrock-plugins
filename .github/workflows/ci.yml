name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TASKROCK_TAG: v0.3.0
      RUST_VERSION: 1.100.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install taskrock
        run: cargo install --locked --git https://github.com/tailrocks/taskrock --tag "$TASKROCK_TAG" taskrock

      - name: Check the plugin
        run: |
          taskrock --version
          python3 scripts/check.py
